version: '3.8'

services:
  # 1. Database Service
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=expense_user
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=expense_db

  # 2. Python FastAPI Backend Service
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=expense_user
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=expense_db
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

  # 3. Nginx Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
