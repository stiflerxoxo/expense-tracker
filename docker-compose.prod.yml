# Production-style stack: runs the prebuilt images from Docker Hub (no local build).
# Usage: docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: expense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend-net]

  backend:
    image: ${DOCKERHUB_USERNAME}/expense-tracker-backend:${IMAGE_TAG:-latest}
    container_name: expense-backend
    restart: unless-stopped
    pull_policy: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend-net, frontend-net]

  frontend:
    image: ${DOCKERHUB_USERNAME}/expense-tracker-frontend:${IMAGE_TAG:-latest}
    container_name: expense-frontend
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontend-net]

volumes:
  pgdata:

networks:
  backend-net:
  frontend-net:
