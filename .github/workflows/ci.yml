name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 1. Run backend tests
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run tests
        run: pytest -q
        working-directory: backend

  # 2. Build and push frontend and backend images
  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-${{ matrix.service }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 3. Deploy to EC2 using SSH
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e

          echo "$SSH_KEY" > key.pem
          chmod 600 key.pem

          trap 'rm -f key.pem' EXIT

          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "$EC2_USER@$EC2_HOST" \
            "DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='${GITHUB_SHA:0:7}' bash -s" <<'REMOTE'
              set -e

              sudo k3s kubectl set image deployment/backend \
                backend="${DOCKERHUB_USERNAME}/expense-tracker-backend:${IMAGE_TAG}"

              sudo k3s kubectl set image deployment/frontend \
                frontend="${DOCKERHUB_USERNAME}/expense-tracker-frontend:${IMAGE_TAG}"

              sudo k3s kubectl rollout status deployment/backend --timeout=180s
              sudo k3s kubectl rollout status deployment/frontend --timeout=180s

              echo "Deployment completed successfully."
          REMOTE








