<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Expense Tracker</h1>
      <p id="status" class="status" role="status"></p>
    </header>

    <section class="summary" aria-label="Summary">
      <div class="total">
        <span class="label">Total spent</span>
        <strong id="total">0.00</strong>
        <span id="count" class="label">0 expenses</span>
      </div>
      <ul id="breakdown" class="breakdown"></ul>
    </section>

    <section class="panel">
      <h2 id="form-title">Add expense</h2>
      <form id="expense-form" autocomplete="off">
        <input type="hidden" id="expense-id">
        <label>Title<input id="title" required maxlength="120" placeholder="Lunch with team"></label>
        <label>Amount<input id="amount" type="number" step="0.01" min="0.01" required placeholder="0.00"></label>
        <label>Category
          <input id="category" list="categories" required maxlength="50" placeholder="Food">
          <datalist id="categories">
            <option>Food</option><option>Transport</option><option>Housing</option>
            <option>Utilities</option><option>Health</option><option>Entertainment</option>
          </datalist>
        </label>
        <label>Date<input id="date" type="date" required></label>
        <div class="actions">
          <button type="submit" id="save">Add expense</button>
          <button type="button" id="cancel" class="ghost" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="list-head">
        <h2>Expenses</h2>
        <select id="filter" aria-label="Filter by category"><option value="">All categories</option></select>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Date</th><th>Title</th><th>Category</th><th class="num">Amount</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No expenses yet. Add your first one above.</p>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
